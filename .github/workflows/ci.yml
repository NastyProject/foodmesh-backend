name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write   # necesario para publicar la imagen en GHCR

jobs:
  # ------------------------------------------------------------
  # 1. Lint + tests (en cada push y en cada PR)
  # ------------------------------------------------------------
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: foodmesh
          POSTGRES_PASSWORD: foodmesh
          POSTGRES_DB: foodmesh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foodmesh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://foodmesh:foodmesh@localhost:5432/foodmesh_test
      # Valores falsos: en los tests se reemplaza la validación de Auth0
      AUTH0_DOMAIN: test.example.com
      AUTH0_AUDIENCE: https://api.foodmesh.test
      LLM_API_KEY: dummy

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar Tesseract (para tests del módulo OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-spa

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Lint (ruff)
        run: ruff check .

      - name: Migraciones
        run: alembic upgrade head

      - name: Tests
        # pytest devuelve 5 si no encuentra tests; no lo tratamos como fallo
        run: pytest -q || [ $? -eq 5 ]

  # ------------------------------------------------------------
  # 2. Build de la imagen Docker (solo en main, si los tests pasan)
  #    Publica en GitHub Container Registry: ghcr.io/nastyproject/foodmesh-backend
  # ------------------------------------------------------------
  docker:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/nastyproject/foodmesh-backend:latest
            ghcr.io/nastyproject/foodmesh-backend:${{ github.sha }}