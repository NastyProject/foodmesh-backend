services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: foodmesh
      POSTGRES_PASSWORD: foodmesh
      POSTGRES_DB: foodmesh
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Caché de recetas. Sin volumen a propósito: es caché, se puede perder.
  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata: